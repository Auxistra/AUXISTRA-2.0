name: CI

on:
  push:
    branches:
      - main
      - develop
      - '**'
  pull_request:

jobs:
  backend-and-flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-fund --no-audit

      - name: Node syntax check entrypoint
        working-directory: backend
        run: node --check server.js

      - name: Node syntax check modular source if present
        working-directory: backend
        run: if [ -d src ]; then find src -name "*.js" -print0 | xargs -0 -n1 node --check; fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test --reporter expanded
