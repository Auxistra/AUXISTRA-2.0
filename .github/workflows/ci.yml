name: CI

on:
  push:
    branches: [ main, Dev-Abhishek ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]  # Only one Node.js version
        flutter-version: ['3.19.0']  # Flutter stable (update if needed)

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 3️⃣ Install backend dependencies
      - name: Install backend dependencies
        run: |
          if [ -f backend/package.json ]; then
            cd backend
            npm install --legacy-peer-deps
          fi

      # 4️⃣ Run backend tests (optional)
      - name: Run backend tests
        run: |
          if [ -f backend/package.json ]; then
            cd backend
            npm test || echo "No backend tests found"
          fi

      # 5️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}

      # 6️⃣ Install Flutter dependencies
      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      # 7️⃣ Analyze Flutter code
      - name: Analyze Flutter code
        run: |
          cd frontend
          flutter analyze || true  # avoid CI fail due to lint errors

      # 8️⃣ Run Flutter tests
      - name: Run Flutter tests
        run: |
          cd frontend
          flutter test || echo "No Flutter tests or tests failed"

      # 9️⃣ Optional: Build APK (for verification)
      - name: Build Flutter APK
        run: |
          cd frontend
          flutter build apk --debug
